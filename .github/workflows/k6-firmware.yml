# K6 voice pager: the receive library's host tests, then Aura (Baofeng UV-K6 firmware, Rust)
# built with the pager patch, with its flash and RAM fit; the .bin is kept as a build artifact.
name: K6 pager firmware
on:
  push:
    branches: [main]
    paths: ["c/k6/**", "c/fixed/**", "c/sotto.h", "c/sotto_lr_dec.inc", "c/sotto_lr_tables.h", "c/sotto_vlr.h", "c/sotto_vlr_dec.inc", "c/sotto_vlr_tables.h", "c/sotto_vlr_tables.c", "firmware/k6-aura/**", "tools/k6_build.sh", "tools/k6_frames.py", "tests/test_k6_pager.py",
            "tests/test_k6_harness.py", "modem/k6_harness.py", "tests/test_k6_mod.py", "tests/test_k6_cb.py", "tests/test_k6_vlr.py", "modem/k6mod.py", "modem/pager.py", "tools/k6_ifcap.py", "tests/test_k6_ifcap.py", "tests/test_k6_ifrx.py", "tests/test_k6_ifpager.py", "modem/k6g.py", "tests/k6_live_emu.py", "sim/k6if/**", "tests/test_k6_ft8.py", "tests/test_k6_ft8tx.py", "tests/test_k6_wsprtx.py", "tests/test_k6_wspriq.py", "tools/k6_wspr.py", "sim/k6digi/**",
            "tools/k6_ft8.py", "tools/k6_upload.py", "tests/test_k6_i2s.py", "tests/test_k6_cwkey.py",
            "tests/test_k6_txrules.py", "tests/test_k6_air.py", "tests/data/k6/air/**", "tests/test_k6_ifcal.py", "tests/test_k6_arq.py", "tests/test_k6_rxmap.py", "tools/k6_rxmap.py", "tests/test_k6_hf.py", "tools/k6_hf.py", "modem/k6.py", "modem/fsk.py",
            "tools/k6_bench.py", "tests/test_k6_bench.py", "tools/k6_sweep.py", "tests/test_k6_sweep.py", "tools/k6_scan.py", "tests/test_k6_scan.py", "tests/test_k6_rt.py", "tests/test_k6_explore.py", "tests/test_k6_xscan.py", "tools/k6_explore.py", "tools/k6_afsweep.py", "tools/k6_update.py", ".github/workflows/k6-firmware.yml"]
  pull_request:
    paths: ["c/k6/**", "c/fixed/**", "c/sotto.h", "c/sotto_lr_dec.inc", "c/sotto_lr_tables.h", "c/sotto_vlr.h", "c/sotto_vlr_dec.inc", "c/sotto_vlr_tables.h", "c/sotto_vlr_tables.c", "firmware/k6-aura/**", "tools/k6_build.sh", "tools/k6_frames.py", "tests/test_k6_pager.py",
            "tests/test_k6_harness.py", "modem/k6_harness.py", "tests/test_k6_mod.py", "tests/test_k6_cb.py", "tests/test_k6_vlr.py", "modem/k6mod.py", "modem/pager.py", "tools/k6_ifcap.py", "tests/test_k6_ifcap.py", "tests/test_k6_ifrx.py", "tests/test_k6_ifpager.py", "modem/k6g.py", "tests/k6_live_emu.py", "sim/k6if/**", "tests/test_k6_ft8.py", "tests/test_k6_ft8tx.py", "tests/test_k6_wsprtx.py", "tests/test_k6_wspriq.py", "tools/k6_wspr.py", "sim/k6digi/**",
            "tools/k6_ft8.py", "tools/k6_upload.py", "tests/test_k6_i2s.py", "tests/test_k6_cwkey.py",
            "tests/test_k6_txrules.py", "tests/test_k6_air.py", "tests/data/k6/air/**", "tests/test_k6_ifcal.py", "tests/test_k6_arq.py", "tests/test_k6_rxmap.py", "tools/k6_rxmap.py", "tests/test_k6_hf.py", "tools/k6_hf.py", "modem/k6.py", "modem/fsk.py",
            "tools/k6_bench.py", "tests/test_k6_bench.py", "tools/k6_sweep.py", "tests/test_k6_sweep.py", "tools/k6_scan.py", "tests/test_k6_scan.py", "tests/test_k6_rt.py", "tests/test_k6_explore.py", "tests/test_k6_xscan.py", "tools/k6_explore.py", "tools/k6_afsweep.py", "tools/k6_update.py", ".github/workflows/k6-firmware.yml"]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy soundfile pytest unicorn capstone
      - name: clang and lld (the modules' builds and their emulated runs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
      - name: pager reassembly and playback vs the M0 decoder path
        run: |
          make -C c VARIANT=v3.7 fixed PYTHON=false
          make -C c/k6
          python -m pytest -q tests/test_k6_pager.py tests/test_k6_harness.py tests/test_k6_mod.py tests/test_k6_cb.py tests/test_k6_cwid.py tests/test_k6_air.py tests/test_k6_ifcap.py tests/test_k6_ifrx.py tests/test_k6_ifpager.py tests/test_k6_vlr.py
      - name: FT8 and WSPR (host cores, GP0 path sim, ft8wf, ft8tx, wsprtx and wspriq on an emulated M0)
        run: python -m pytest -q tests/test_k6_ft8.py tests/test_k6_ft8tx.py tests/test_k6_wsprtx.py tests/test_k6_wspriq.py
      - name: modules on an emulated M0 (the transmit rules for every module that keys up, the IF tap, calibration) and upload ARQ
        run: python -m pytest -q tests/test_k6_txrules.py tests/test_k6_cwkey.py tests/test_k6_i2s.py tests/test_k6_ifcal.py tests/test_k6_arq.py tests/test_k6_rxmap.py tests/test_k6_hf.py tests/test_k6_bench.py tests/test_k6_update.py tests/test_k6_sweep.py tests/test_k6_scan.py tests/test_k6_rt.py tests/test_k6_explore.py tests/test_k6_xscan.py

  aura-pager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchains (clang/lld for the C library, Rust for Aura)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
          rustup toolchain install stable --profile minimal --target thumbv6m-none-eabi
      - name: build ID (the commit the images report as build=)
        id: bid
        run: |
          sha=${{ github.event.pull_request.head.sha || github.sha }}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(printf %.7s "$sha")" >> "$GITHUB_OUTPUT"
      - name: build Aura + pager, check the fit
        env:
          SOTTO_SHA: ${{ steps.bid.outputs.sha }}
        run: sh firmware/k6-aura/build.sh
      - name: size reports
        if: always()
        run: |
          head -3 firmware/k6-aura/out/size-*.txt || true
          cat firmware/k6-aura/out/build-id.txt firmware/k6-aura/out/*.sha256 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-pager-${{ steps.bid.outputs.short }}
          if-no-files-found: ignore
          path: |
            firmware/k6-aura/out/*.bin
            firmware/k6-aura/out/*.elf
            firmware/k6-aura/out/size-*.txt
            firmware/k6-aura/out/build-id.txt
            firmware/k6-aura/out/frames-*.txt
            firmware/k6-aura/out/*.sha256
