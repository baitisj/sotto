# The C port builds from the committed tables with no Python, and those tables match what
# tools/export_codebook_c.py, tools/export_hiss_c.py and tools/gen_fx_tables.py write.
name: C build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-without-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libsotto, tools and fixed point, with Python unavailable to make
        run: |
          make PYTHON=false
          make fixed PYTHON=false
          make -C c check
          make -C c check-rowgen PYTHON=false
          make -C c check-synthstate PYTHON=false
          make -C c check-lowdelay PYTHON=false
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: committed tables match the generators
        run: make check-tables PYTHON=python
  # The K6 firmware moved to baitisj/blowfang (2026-11-09). A new file under one of its old paths
  # here would fork it quietly, so this fails and points there. One path per line.
  k6-moved-to-blowfang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no K6 firmware files in sotto
        run: |
          bad=$(git ls-files \
            'c/k6/*' \
            'firmware/*' \
            'sim/k6if/*' \
            'sim/k6digi/*' \
            'modem/k6*.py' \
            'modem/pager.py' \
            'modem/fsk.py' \
            'modem/psk31.py' \
            'modem/aprs.py' \
            'modem/civ.py' \
            'tools/k6_*' \
            'tools/k6-*' \
            'tools/midi_songs/*' \
            'tests/test_k6*.py' \
            'tests/k6_live_emu.py' \
            'tests/data/k6/*' \
            'docs/k6-*' \
            'docs/results/k6/*')
          if [ -n "$bad" ]; then
            echo "The K6 firmware lives in https://github.com/baitisj/blowfang now. Move these there:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
  # sotto 1200 (8 kHz) and sotto 1200 hiss (16 kHz) on the Cortex-M4 bench (TYT MD-UV380/390,
  # c/fixed/cm4/): the M4 build's bits and samples must equal the x86 build's, and no 40 ms call
  # may take more than the STM32F405's 168 MHz. The MHz, RAM and flash table goes to the summary.
  cm4-sotto-1200:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang, lld, flac, the emulator and the disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            flac
          pip install \
            unicorn==2.1.3 \
            capstone
      - name: x86 fixed-point tools
        run: make -C c fixed PYTHON=false
      - name: M4 bench, -O2
        run: sh tools/cm4_lr_check.sh -O2
      - name: M4 bench, -Os (OpenRTX's default)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-Os sh tools/cm4_lr_check.sh -Os
      - name: M4 bench, -O2 with SMLAD/SMLALD as inline assembly (the path GCC before 10 takes)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-asm sh tools/cm4_lr_check.sh -O2 -DFX_ARM_DSP_ASM
