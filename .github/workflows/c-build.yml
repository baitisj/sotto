# The C port builds from the committed tables with no Python, and those tables match what
# tools/export_codebook_c.py, tools/export_hiss_c.py and tools/gen_fx_tables.py write.
name: C build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-without-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libsotto, tools and fixed point, with Python unavailable to make
        run: |
          make PYTHON=false
          make fixed PYTHON=false
          make -C c check
          make -C c check-rowgen PYTHON=false
          make -C c check-synthstate PYTHON=false
          make -C c check-lowdelay PYTHON=false
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: committed tables match the generators
        run: make check-tables PYTHON=python
  # make check: the C API test, the table check, the v3.7 copy (make c37) and every Python test,
  # including the C-against-Python checks and the golden outputs (tools/golden.py: a cleanup
  # that moves any mode's frames, fixed-point samples or PESQ fails). Then the page's WebAssembly
  # codec against the native tools, and docs/*.wasm must be the build of the current sources.
  # The fixed-point against float report (tools/check_fx.py) goes to the job summary.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          pip install \
            numpy \
            scipy \
            soundfile \
            pesq \
            pystoi \
            pytest
      - name: clang, lld and the wasm32-wasi sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            wasi-libc \
            libclang-rt-18-dev-wasm32
      - name: make check
        run: make check PYTHON=python
      - name: DEBUG k6 decoder (temporary)
        if: always()
        run: |
          cc --version | head -1
          lsb_release -d
          grep -m1 "model name" /proc/cpuinfo
          python - <<'PYEOF'
          import subprocess, numpy as np, hashlib
          ref = "fff9 ffbb 0029 fff8 0002 ffff fff7 0006 0002 ffa0 084a d888 fd13 631c 2e5f 3b7f f0a0 044d f3d8 16ca 2ceb 5e0e ade1 4c1e c759 4bc0 e50a 1caa 600a 3830 f292 b693 1ede 8953 b7f4 0633 f934 2098 5828 c92d 907e bb57 f039 0836 f53e 8535 dfe2 1f81 f79c 04df 01a7 ffdf ffe1 0199 0b15 ea7e 245f e013 6ca6 6367 1441 dc98 6f69 beac da61 1a72 1510 e3db 4e8e 749d f6f8 6c0e ecfd fb7a fc18 fe71 05da 0d3b 13b7 12f6 2eb0 d8c8 f6b1 d3b5 e020 3fe3 d58a 0960 fca1 018c 0311 ffff ffff ffe8 fe09 ff45 0232 00f7 ff97 ff49 008f 0048 ffff fff8 fffd 0002 fffa fffe 0004 fffd 0002 0000 ffff 0002 fffe fffb 0004 fffc 0002 0006 fffb 0002 0003 0002 fffe 0005 fff8 ff73 ffa8 005e 002e 00b8 fdff 0215 ff54 ffaf ff47 012b fff4 0001 003f ffbe fff5 0002 fffe 0008 fe98 37a3 8b28 c31a 759b 2c0b 0eeb c23b 6beb f6eb e312 0a0a 0795 fe67 fda1 a022 04ba 37bb c5c3 c8e6 40c3 8175 e3ba ffaf fe85 f683 13d4 19ed 2359 c52d 9844 196b cf85 2fe1 60c0 446b aba4 6045 a81e 6de1 d5f4 0958 8dde bb0e d2a0 171c fdaf 90ea cb4d 0412 0038 ff72 ff3c c7a2 b3a3 8f0c 90c9 880a 97bc aa4a 524b ce00 3a2e e6c7 0b68 2015 a362 278e 6701 04a4 33b6 7b49 65e7 d8b7 008c 04b6 5409 2557 ed27 c83c a525 2792 4a05 827f dcb2 08b6 e5a8 6497 a199 dcce b3b2 c54f e0f6 57f6 c6ba 42c9 da1b 0ff7 3cba 92fd 75e2 cf73 f277 feeb 099b fabd fe82 01fc 0156 fc12 03eb 0193 01d9 feba fffe ff12 01c7 ffac ffd0 ffbc ffa7 0005 005b ff7b 00b7 fff1 fa3c 066c 04b1 cb14 2a38 4ad7 5487 accd 1ea3 d0a2 d5fc 09c3 4f50 5c3d 9323 89b1 52db 0884 492b 613b 8e0d b183 3191 5070 cf4c a77e 8b19 cc38".split()
          subprocess.run(["c/fixed/sotto_dec_fx_k6", "-16", "tests/golden/male_libri3436_15s__2400.bit", "/tmp/o.raw"], check=True)
          y = np.fromfile("/tmp/o.raw", "<i2").astype(np.int64)
          b = y[:len(y) // 320 * 320].reshape(-1, 320)
          got = [f"{int(x.sum()) & 0xffff:04x}" for x in b]
          bad = [i for i in range(len(got)) if got[i] != ref[i]]
          print("sha", hashlib.sha256(y.astype("<i2").tobytes()).hexdigest()[:16], "blocks differ:", len(bad), bad[:40])
          if bad:
              print("block", bad[0], "samples:", " ".join(map(str, b[bad[0]].tolist())))
          PYEOF
      - name: WebAssembly codec against the native tools
        run: make -C c/wasm check PYTHON=python
      - name: docs/sotto.wasm and docs/sotto_vlr.wasm are the build of the current sources
        run: |
          for f in sotto.wasm sotto_vlr.wasm; do
            if ! cmp -s c/wasm/$f docs/$f; then
              echo "docs/$f is stale: run make -C c/wasm install and commit it"
              exit 1
            fi
          done
      - name: fixed point against float (report)
        run: |
          {
            echo "### tools/check_fx.py"
            echo '```'
            python tools/check_fx.py docs/samples/male_libri3436_15s__original.flac --loss 0.05
            python tools/check_fx.py --v38 --seconds 6 docs/samples/v38/male_libri3436_15s__original16.flac
            python tools/check_fx.py --lr docs/samples/male_libri3436_15s__original.flac
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The K6 firmware moved to baitisj/blowfang (2026-11-09). A new file under one of its old paths
  # here would fork it quietly, so this fails and points there. One path per line.
  k6-moved-to-blowfang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no K6 firmware files in sotto
        run: |
          bad=$(git ls-files \
            'c/k6/*' \
            'firmware/*' \
            'sim/k6if/*' \
            'sim/k6digi/*' \
            'modem/k6*.py' \
            'modem/pager.py' \
            'modem/fsk.py' \
            'modem/psk31.py' \
            'modem/aprs.py' \
            'modem/civ.py' \
            'tools/k6_*' \
            'tools/k6-*' \
            'tools/midi_songs/*' \
            'tests/test_k6*.py' \
            'tests/k6_live_emu.py' \
            'tests/data/k6/*' \
            'docs/k6-*' \
            'docs/results/k6/*')
          if [ -n "$bad" ]; then
            echo "The K6 firmware lives in https://github.com/baitisj/blowfang now. Move these there:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
  # sotto 1200 (8 kHz) and sotto 1200 hiss (16 kHz) on the Cortex-M4 bench (TYT MD-UV380/390,
  # c/fixed/cm4/): the M4 build's bits and samples must equal the x86 build's, and no 40 ms call
  # may take more than the STM32F405's 168 MHz. The MHz, RAM and flash table goes to the summary.
  cm4-sotto-1200:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang, lld, flac, the emulator and the disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            flac
          pip install \
            unicorn==2.1.3 \
            capstone
      - name: x86 fixed-point tools
        run: make -C c fixed PYTHON=false
      - name: M4 bench, -O2
        run: sh tools/cm4_lr_check.sh -O2
      - name: M4 bench, -Os (OpenRTX's default)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-Os sh tools/cm4_lr_check.sh -Os
      - name: M4 bench, -O2 with SMLAD/SMLALD as inline assembly (the path GCC before 10 takes)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-asm sh tools/cm4_lr_check.sh -O2 -DFX_ARM_DSP_ASM
