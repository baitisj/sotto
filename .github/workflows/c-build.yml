# The C port builds from the committed tables with no Python, and those tables match what
# tools/export_codebook_c.py, tools/export_hiss_c.py and tools/gen_fx_tables.py write.
name: C build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-without-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libsotto, tools and fixed point, with Python unavailable to make
        run: |
          make PYTHON=false
          make fixed PYTHON=false
          make -C c check
          make -C c check-rowgen PYTHON=false
          make -C c check-synthstate PYTHON=false
          make -C c check-lowdelay PYTHON=false
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: committed tables match the generators
        run: make check-tables PYTHON=python
  # make check: the C API test, the table check, the v3.7 copy (make c37) and every Python test,
  # including the C-against-Python checks and the golden outputs (tools/golden.py: a cleanup
  # that moves any mode's frames, fixed-point samples or PESQ fails). Then the page's WebAssembly
  # codec against the native tools, and docs/*.wasm must be the build of the current sources.
  # The fixed-point against float report (tools/check_fx.py) goes to the job summary.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          pip install \
            numpy \
            scipy \
            soundfile \
            pesq \
            pystoi \
            pytest
      - name: clang, lld and the wasm32-wasi sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            wasi-libc \
            libclang-rt-18-dev-wasm32
      - name: make check
        run: make check PYTHON=python
      - name: DEBUG k6 decoder (temporary)
        if: always()
        run: |
          cd c
          OTH="sotto_dec.c fixed/sotto_fx_dec.c fixed/sotto_fx_enc.c fixed/sotto_fx_lr.c fixed/sotto_fx_lr_enc.c fixed/sotto_fx_vlr.c sotto_vlr_tables.c fixed/fx_math.c fixed/fx_tables.c"
          F="-std=c99 -ffp-contract=off -I. -DFX_CHECK -DSOTTO_V36 -DSOTTO_PITCH_THIRD -DSOTTO_V38 -DFX_NARROW_MUL -DFX_HISS_LIGHT -DFX_HISS_FB"
          B=../tests/golden/male_libri3436_15s__2400.bit
          gcc -Q --help=target -O2 | grep -E "^ +-march=|^ +-mavx2 |^ +-mtune=" || true
          gcc -O2 $F -c $OTH
          prev=""
          for n in $(seq 0 60); do
            gcc -O2 $F -fdbg-cnt=vect_loop:$n -c -o hiss.o fixed/sotto_fx_hiss.c 2>/dev/null || { echo "dbg-cnt $n failed"; break; }
            gcc -o /tmp/k6 *.o hiss.o 2>/dev/null || gcc -o /tmp/k6 $(for f in $OTH; do echo $(basename $f .c).o; done) hiss.o
            /tmp/k6 -16 $B /tmp/o.raw
            h=$(sha256sum < /tmp/o.raw | cut -c1-16)
            echo "vect_loop:$n $h"
            if [ "$h" != "7581dfe4224cf5b8" ]; then
              echo "first bad at $n; loops vectorized at $n:"
              gcc -O2 $F -fdbg-cnt=vect_loop:$n -fopt-info-vec-optimized -c -o /dev/null fixed/sotto_fx_hiss.c 2>&1 | grep "loop vectorized"
              break
            fi
          done
          echo "x86-64 baseline:"
          gcc -O2 -march=x86-64 $F -o /tmp/k6 $OTH fixed/sotto_fx_hiss.c && /tmp/k6 -16 $B /tmp/o.raw && sha256sum < /tmp/o.raw | cut -c1-16
          gcc -O2 -march=x86-64-v3 $F -o /tmp/k6 $OTH fixed/sotto_fx_hiss.c && /tmp/k6 -16 $B /tmp/o.raw && sha256sum < /tmp/o.raw | cut -c1-16
      - name: WebAssembly codec against the native tools
        run: make -C c/wasm check PYTHON=python
      - name: docs/sotto.wasm and docs/sotto_vlr.wasm are the build of the current sources
        run: |
          for f in sotto.wasm sotto_vlr.wasm; do
            if ! cmp -s c/wasm/$f docs/$f; then
              echo "docs/$f is stale: run make -C c/wasm install and commit it"
              exit 1
            fi
          done
      - name: fixed point against float (report)
        run: |
          {
            echo "### tools/check_fx.py"
            echo '```'
            python tools/check_fx.py docs/samples/male_libri3436_15s__original.flac --loss 0.05
            python tools/check_fx.py --v38 --seconds 6 docs/samples/v38/male_libri3436_15s__original16.flac
            python tools/check_fx.py --lr docs/samples/male_libri3436_15s__original.flac
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The K6 firmware moved to baitisj/blowfang (2026-11-09). A new file under one of its old paths
  # here would fork it quietly, so this fails and points there. One path per line.
  k6-moved-to-blowfang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no K6 firmware files in sotto
        run: |
          bad=$(git ls-files \
            'c/k6/*' \
            'firmware/*' \
            'sim/k6if/*' \
            'sim/k6digi/*' \
            'modem/k6*.py' \
            'modem/pager.py' \
            'modem/fsk.py' \
            'modem/psk31.py' \
            'modem/aprs.py' \
            'modem/civ.py' \
            'tools/k6_*' \
            'tools/k6-*' \
            'tools/midi_songs/*' \
            'tests/test_k6*.py' \
            'tests/k6_live_emu.py' \
            'tests/data/k6/*' \
            'docs/k6-*' \
            'docs/results/k6/*')
          if [ -n "$bad" ]; then
            echo "The K6 firmware lives in https://github.com/baitisj/blowfang now. Move these there:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
  # sotto 1200 (8 kHz) and sotto 1200 hiss (16 kHz) on the Cortex-M4 bench (TYT MD-UV380/390,
  # c/fixed/cm4/): the M4 build's bits and samples must equal the x86 build's, and no 40 ms call
  # may take more than the STM32F405's 168 MHz. The MHz, RAM and flash table goes to the summary.
  cm4-sotto-1200:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang, lld, flac, the emulator and the disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            flac
          pip install \
            unicorn==2.1.3 \
            capstone
      - name: x86 fixed-point tools
        run: make -C c fixed PYTHON=false
      - name: M4 bench, -O2
        run: sh tools/cm4_lr_check.sh -O2
      - name: M4 bench, -Os (OpenRTX's default)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-Os sh tools/cm4_lr_check.sh -Os
      - name: M4 bench, -O2 with SMLAD/SMLALD as inline assembly (the path GCC before 10 takes)
        run: CM4_CHECK_DIR=c/fixed/cm4/check-asm sh tools/cm4_lr_check.sh -O2 -DFX_ARM_DSP_ASM
