<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="DejaVu Sans, system-ui, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #c9c7c0; stroke-width: 1.5; }
    .voc { fill: #e8f1fb; stroke: #2a78d6; }
    .rad { fill: #fdeee6; stroke: #eb6834; }
    .t { font-size: 14px; font-weight: bold; fill: #0b0b0b; text-anchor: middle; }
    .s { font-size: 11.5px; fill: #52514e; text-anchor: middle; }
    .h { font-size: 13px; font-weight: bold; fill: #52514e; }
    .a { stroke: #52514e; stroke-width: 1.8; fill: none; marker-end: url(#ar); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="900" height="360" fill="#fcfcfb"/>
  <text x="20" y="28" class="h">SENDER</text>
  <rect x="20" y="42" width="120" height="78" rx="10" class="box"/>
  <text x="80" y="76" class="t">Microphone</text><text x="80" y="96" class="s">8000 numbers</text><text x="80" y="110" class="s">per second</text>
  <rect x="170" y="42" width="160" height="78" rx="10" class="box voc"/>
  <text x="250" y="66" class="t">Analysis</text><text x="250" y="86" class="s">pitch · voicing</text><text x="250" y="101" class="s">envelope · energy</text><text x="250" y="114" class="s">(chapters 2–3)</text>
  <rect x="360" y="42" width="150" height="78" rx="10" class="box voc"/>
  <text x="435" y="66" class="t">Quantizer</text><text x="435" y="86" class="s">round to a few</text><text x="435" y="101" class="s">levels: 48 bits</text><text x="435" y="114" class="s">(chapter 4)</text>
  <rect x="540" y="42" width="170" height="78" rx="10" class="box rad"/>
  <text x="625" y="66" class="t">Channel coding</text><text x="625" y="86" class="s">CRC · error-correcting</text><text x="625" y="101" class="s">code · spreading</text><text x="625" y="114" class="s">(chapter 6)</text>
  <rect x="740" y="42" width="140" height="78" rx="10" class="box rad"/>
  <text x="810" y="70" class="t">C4FM</text><text x="810" y="88" class="s">bits become</text><text x="810" y="103" class="s">radio frequency hops</text>
  <path d="M140,81 H166" class="a"/><path d="M330,81 H356" class="a"/><path d="M510,81 H536" class="a"/><path d="M710,81 H736" class="a"/>
  <path d="M810,120 V160 H90 V198" class="a" stroke-dasharray="5 4"/>
  <text x="450" y="152" class="s" style="font-size:12.5px">radio channel: noise, and fading as the car moves (chapter 6)</text>
  <text x="20" y="190" class="h">RECEIVER</text>
  <rect x="20" y="202" width="140" height="78" rx="10" class="box rad"/>
  <text x="90" y="230" class="t">C4FM</text><text x="90" y="248" class="s">frequency hops</text><text x="90" y="263" class="s">back into bits</text>
  <rect x="190" y="202" width="170" height="78" rx="10" class="box rad"/>
  <text x="275" y="226" class="t">Error correction</text><text x="275" y="246" class="s">fix bit errors; flag</text><text x="275" y="261" class="s">frames that can't</text><text x="275" y="274" class="s">be fixed</text>
  <rect x="390" y="202" width="150" height="78" rx="10" class="box voc"/>
  <text x="465" y="226" class="t">Dequantizer</text><text x="465" y="246" class="s">48 bits back into</text><text x="465" y="261" class="s">pitch, energy, envelope;</text><text x="465" y="274" class="s">fades out lost frames</text>
  <rect x="570" y="202" width="170" height="78" rx="10" class="box voc"/>
  <text x="655" y="226" class="t">Synthesis</text><text x="655" y="246" class="s">add up sine waves,</text><text x="655" y="261" class="s">or shape noise</text><text x="655" y="274" class="s">(chapter 5)</text>
  <rect x="770" y="202" width="110" height="78" rx="10" class="box"/>
  <text x="825" y="246" class="t">Speaker</text>
  <path d="M160,241 H186" class="a"/><path d="M360,241 H386" class="a"/><path d="M540,241 H566" class="a"/><path d="M740,241 H766" class="a"/>
  <rect x="20" y="306" width="18" height="14" rx="3" class="box voc"/><text x="46" y="318" style="font-size:12px;fill:#52514e">the vocoder (sotto v3.5)</text>
  <rect x="230" y="306" width="18" height="14" rx="3" class="box rad"/><text x="256" y="318" style="font-size:12px;fill:#52514e">the radio link (sotto VW payload and C4FM softmodem)</text>
  <text x="20" y="345" style="font-size:12px;fill:#52514e">Speed: 128,000 bits per second from the microphone, squeezed to 2,400 for the voice, padded to 7,200 to survive the trip.</text>
</svg>
