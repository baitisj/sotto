<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="DejaVu Sans, system-ui, sans-serif">
  <style>
    .t { font-size: 13px; font-weight: bold; fill: #0b0b0b; text-anchor: middle; }
    .s { font-size: 11.5px; fill: #52514e; text-anchor: middle; }
    .n { font-size: 10px; fill: #0b0b0b; text-anchor: middle; }
  </style>
  <rect width="900" height="200" fill="#fcfcfb"/>
  <text x="20" y="26" style="font-size:14px;font-weight:bold;fill:#0b0b0b">One sotto v3.5 frame: 48 bits for 20 milliseconds of speech</text>
  <!-- 48 bits * 17.5 px = 840 px, from x=30 -->
  <rect x="30" y="50" width="35" height="56" fill="#f9dcc9" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="65" y="50" width="122.5" height="56" fill="#cfe2f8" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="187.5" y="50" width="87.5" height="56" fill="#fbe7b8" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="275" y="50" width="595" height="56" fill="#c6eedd" stroke="#fcfcfb" stroke-width="2"/>
  <text x="47.5" y="83" class="t">2</text>
  <text x="126" y="83" class="t">7</text>
  <text x="231" y="83" class="t">5</text>
  <text x="572" y="83" class="t">34</text>
  <text x="47.5" y="126" class="s">voicing</text>
  <text x="126" y="126" class="s">pitch</text>
  <text x="231" y="126" class="s">energy</text>
  <text x="572" y="126" class="s">envelope shape: three codebook entries</text>
  <text x="47.5" y="142" class="s">U, V, M</text><text x="47.5" y="156" class="s">or edge</text>
  <text x="126" y="142" class="s">128 levels,</text><text x="126" y="156" class="s">50–500 Hz</text>
  <text x="231" y="142" class="s">32 levels,</text><text x="231" y="156" class="s">0 = silence</text>
  <text x="572" y="142" class="s">stage 1: 12 bits (4,096 choices) + stage 2: 11 bits + stage 3: 11 bits</text>
  <text x="572" y="156" class="s">each stage adds a correction to the stages before it</text>
  <text x="30" y="186" style="font-size:11.5px;fill:#52514e">Sent most important first. 50 frames a second × 48 bits = 2,400 bits per second.</text>
</svg>
